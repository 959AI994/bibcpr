[project]
name = "bibcpr"
version = "0.1.0"
description = "bibcpr — evidence-first BibTeX auditing/verification/repair agent (CLI: cpr)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jingxin Wang", email = "jingxin.wang@sjtu.edu.cn" }]
keywords = ["bibtex", "citations", "academic", "references", "crossref", "arxiv", "dblp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "bibtexparser>=2.0.0b8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "platformdirs>=4.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/959AI994/bibcpr"
Issues = "https://github.com/959AI994/bibcpr/issues"
Source = "https://github.com/959AI994/bibcpr"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
cpr = "cpr.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cpr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
